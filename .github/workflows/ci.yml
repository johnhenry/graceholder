name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["22", "24"]'
      gate-commands: |
        npm run lint
        npm run typecheck
        npm test

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
